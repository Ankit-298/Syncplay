<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SyncPlay – Now Playing</title>
  <link rel="stylesheet" href="client.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-mesh"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <canvas id="bgWave" class="bg-wave-canvas"></canvas>
  <div id="particles" class="particles-container"></div>

  <div class="player-wrapper">

    <!-- ======= CONNECTION SCREEN ======= -->
    <div class="connection-screen" id="connectionScreen">
      <div class="pulse-ring"></div>
      <div class="pulse-ring ring2"></div>
      <div class="connection-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <h1 class="app-title">SyncPlay</h1>
      <p class="app-subtitle">Synchronized Audio Experience</p>
      <p class="connection-status" id="statusText">Connecting to Server...</p>
      <div class="loading-dots" id="loadingDots">
        <span></span><span></span><span></span>
      </div>
      <button class="unmute-btn" id="unmuteBtn" style="display:none;">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Tap to Play
      </button>
    </div>

    <!-- ======= NOW PLAYING SCREEN ======= -->
    <div class="now-playing" id="nowPlaying" style="display:none;">

      <!-- Top Bar: LIVE pill + BT badge -->
      <div class="top-bar">
        <div class="live-pill" id="livePill">
          <span class="live-dot"></span>
          <span id="liveLabel">LIVE</span>
        </div>
        <div class="top-bar-center">
          <span class="app-name-small">SyncPlay</span>
        </div>
        <div class="bt-badge" id="btBadge" style="display:none;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/>
          </svg>
          <span>BT</span>
        </div>
      </div>

      <!-- Bluetooth Device Card -->
      <div class="bt-device-card" id="btDeviceCard" style="display:none;">
        <div class="bt-card-inner">
          <div class="airpods-visual">
            <svg class="airpods-svg" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(8,5)">
                <ellipse cx="22" cy="22" rx="18" ry="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
                <ellipse cx="22" cy="22" rx="10" ry="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                <rect x="18" y="40" width="8" height="18" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
                <circle cx="22" cy="57" r="2" fill="rgba(255,255,255,0.18)"/>
                <path d="M16 14 Q22 10 28 14" stroke="rgba(255,255,255,0.35)" stroke-width="1" fill="none" stroke-linecap="round"/>
              </g>
              <g transform="translate(72,5) scale(-1,1) translate(-44,0)">
                <ellipse cx="22" cy="22" rx="18" ry="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
                <ellipse cx="22" cy="22" rx="10" ry="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                <rect x="18" y="40" width="8" height="18" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
                <circle cx="22" cy="57" r="2" fill="rgba(255,255,255,0.18)"/>
                <path d="M16 14 Q22 10 28 14" stroke="rgba(255,255,255,0.35)" stroke-width="1" fill="none" stroke-linecap="round"/>
              </g>
              <g transform="translate(55,18)">
                <path d="M0 10 Q3 5 0 0" stroke="rgba(139,92,246,0.8)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M-5 14 Q2 7 -5 0"  stroke="rgba(139,92,246,0.4)" stroke-width="1" fill="none" stroke-linecap="round"/>
                <path d="M5 14 Q12 7 5 0"   stroke="rgba(6,182,212,0.4)"  stroke-width="1" fill="none" stroke-linecap="round"/>
              </g>
            </svg>
          </div>
          <div class="bt-info">
            <span class="bt-label">Connected via Bluetooth</span>
            <span class="bt-name" id="btDeviceName">Wireless Earbuds</span>
          </div>
          <span class="bt-dot"></span>
        </div>
      </div>

      <!-- Album Art (vinyl) -->
      <div class="album-wrap">
        <div class="a-ring r1"></div>
        <div class="a-ring r2"></div>
        <div class="album-glow"></div>
        <div class="album-inner" id="albumInner">
          <div class="vinyl-groove g1"></div>
          <div class="vinyl-groove g2"></div>
          <div class="vinyl-groove g3"></div>
          <div class="vinyl-center">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Track Info -->
      <div class="track-info">
        <h2 class="track-title" id="trackTitle">Live Audio Stream</h2>
        <p class="track-artist" id="trackArtist">Streaming from Host</p>
      </div>

      <!-- ─── PROGRESS BAR ─── -->
      <div class="progress-section">
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
          <!-- glow shimmer -->
          <div class="progress-shimmer" id="progressShimmer"></div>
        </div>
        <div class="time-row">
          <span class="time-elapsed" id="timeElapsed">0:00</span>
          <span class="time-live" id="timeLiveMode">LIVE STREAM</span>
          <span class="time-remaining" id="timeRemaining">-0:00</span>
        </div>
      </div>

      <!-- ─── WAVEFORM ─── -->
      <div class="wave-wrap">
        <canvas id="waveCanvas" class="wave-visualizer" width="360" height="120"></canvas>
      </div>

      <!-- Host controls playback — client only has volume -->
      <!-- ─── VOLUME + MUTE ─── -->
      <div class="volume-row">
        <button class="vol-mute-btn" id="muteToggleBtn" title="Mute/Unmute">
          <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
        <div class="vol-slider-wrap">
          <div class="vol-fill" id="volFill"></div>
          <input type="range" id="volumeSlider" class="vol-slider" min="0" max="100" value="100">
        </div>
        <span class="vol-pct" id="volPct">100%</span>
      </div>

      <!-- ─── STATS ROW ─── -->
      <div class="stats-row">
        <div class="stat-chip">
          <span class="stat-ico">⚡</span>
          <div>
            <div class="stat-lbl">Latency</div>
            <div class="stat-val"><span id="syncError">--</span><span class="stat-unit">ms</span></div>
          </div>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-chip">
          <span class="stat-ico">📶</span>
          <div>
            <div class="stat-lbl">Mode</div>
            <div class="stat-val"><span id="modeDisplay">--</span></div>
          </div>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-chip">
          <span class="stat-ico">✨</span>
          <div>
            <div class="stat-lbl">Quality</div>
            <div class="stat-val"><span id="qualityDisplay">Hi-Fi</span></div>
          </div>
        </div>
      </div>

    </div><!-- /now-playing -->
  </div><!-- /player-wrapper -->

  <audio id="remoteAudio" autoplay playsinline></audio>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
